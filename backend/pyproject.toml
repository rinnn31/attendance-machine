[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-server-backend"
version = "0.1.0"
description = "Backend server for attendance device"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "SQLAlchemy[asyncio]",
    "asyncmy",
    "insightface",
    "face-engine[insightface]",
    "opencv-python-headless",
    "numpy",
    "greenlet",
    "cryptography",
    "afis"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
cpu = ["onnxruntime"]
gpu = ["onnxruntime-gpu"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"