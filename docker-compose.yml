version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: attendx_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=attendx_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - USE_CUDA=${USE_CUDA:-false}
    container_name: attendx_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+asyncmy://user:password@db:3306/attendx_db
      - PYTHONUNBUFFERED=1
      - FACE_CAPTURE_IMAGE_PATH=/app/face_attendance/
    volumes:
      - ./backend:/app
      - insightface_models:/root/.insightface
      - face_attendance:/app/face_attendance
      - face_engine:/root/.cache/face_engine
    depends_on:
      db:
        condition: service_healthy  # Đợi đến khi MySQL thực sự sẵn sàng

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendx_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
  insightface_models:
  face_attendance:
  face_engine: